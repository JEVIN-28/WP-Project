<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waste Passport | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Global Background */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }
    
    .screen-wrapper {
      width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, #dbe2e9, #b9c6d2);
      display: flex; justify-content: center; align-items: center;
    }

    /* Main Card Setup */
    .main-card {
      width: 85%; height: 80%; max-width: 1400px;
      background: #FAFAFA;/*Changed to solid white to match the image*/
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      display: flex; flex-direction: column; padding: 2.5rem 3rem;
    }

    /* Top Navigation */
    .card-header { display: flex; justify-content: space-between; font-weight: bold; color: #064e3b; }
    nav { display: flex; gap: 2rem; }
    nav a { text-decoration: none; color: #1a202c; transition: color 0.2s; }
    nav a:hover { color: #16a34a; }

    /* Center Layout */
    .card-body {
      flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    }

    /* Typography and Images */
    .hero-title { font-family: 'Playfair Display', serif; font-size: 5rem; line-height: 1.1; color: #064e3b; }
    .hero-image-container img {
      width: 450px; height: auto;
      mix-blend-mode: multiply; /* Blends the white background of the JPG */
    }
    
    .hero-text-right { font-size: 0.95rem; line-height: 1.6; color: #1a202c; max-width: 300px; justify-self: flex-end; }
    
    /* Call to Action Button */
    .launch-btn {
      display: inline-block; margin-top: 25px; padding: 12px 28px;
      background: #16a34a; color: white; text-decoration: none;
      border-radius: 50px; font-weight: bold; transition: background 0.2s;
    }
    .launch-btn:hover { background: #15803d; }
  </style>
</head>
<body>

  <div class="screen-wrapper">
    <div class="main-card">
      
      <!-- Top Navigation -->
      <header class="card-header">
        <div>♻️ Waste Passport MVP</div>
        <nav>
          <a href="index.html" style="border-bottom: 2px solid #16a34a;">Home</a>
          <a href="app.html">Scanner App</a>
        </nav>
      </header>

      <!-- Center Hero Area -->
      <main class="card-body">
        <div class="hero-left">
          <h1 class="hero-title">WASTE<br>PASSPORT</h1>
        </div>
        
        <div class="hero-image-container">
          <!-- Calls the exact image file name -->
          <img src="wp.jpg" alt="Waste Passport Scan Graphic">
        </div>

        <div class="hero-text-right">
          <p><strong>Scan • Know • Dispose Right</strong><br><br>Shifting the burden of recycling knowledge from the consumer to the product itself. Scan a product's digital passport to instantly access materials, AI sorting guides, and local drop-off points.</p>
          
          <!-- This button links to your functional page! -->
          <a href="app.html" class="launch-btn">Launch Scanner ➔</a>
        </div>
      </main>

    </div>
  </div>

</body>
</html>
